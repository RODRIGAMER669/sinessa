<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Pokemon</title>
</head>

<body>
    <h1>Crear Pokemon</h1>

    <form action="/peliculas" method="post">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo">
        <br><br>

        <label for="imagen">Imágen (URL):</label>
        <input type="text" id="imagen" name="imagen">
        <br><br>

        <label for="detalles">Detalles de la pelicula</label>
        <input type="text" id="detalles" name="detalles">
        <br><br>

        <label for="sinopsis">Sinopsis de la pelicula</label>
        <input type="text" id="sinopsis" name="sinopsis">
        <br><br>

        <label for="genero">Género de la pelicula</label>
        <input type="text" id="genero" name="genero">
        <br><br>

        <label for="duracion">Duración (mins):</label>
        <input type="number" id="precio" name="duracion" step="1" min="0">
        <br><br>

        <label for="fechaEstreno">Fecha de estreno:</label>
        <input type="date" id="fechaEstreno" name="fechaEstreno">
        <br><br>

        <button type="submit">Añadir película</button>
    </form>
</body>

</html>
